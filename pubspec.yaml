name: people_tracker
description: Track interesting people locally.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  file_picker: ^8.1.2
  yaml: ^3.1.2
  shared_preferences: ^2.5.0
  path: ^1.9.0
  permission_handler: ^11.3.0
  http: ^1.2.0
  xml: ^6.5.0
  url_launcher: ^6.2.0
  archive: ^3.4.0
  flutter_markdown: ^0.7.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/interesting_logo.jpg"
  adaptive_icon_background: "#5BA8C4"
  adaptive_icon_foreground: "assets/interesting_logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/interesting_logo.jpg
